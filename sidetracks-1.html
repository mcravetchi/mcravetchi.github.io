<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidetracks — 1/18</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #C8BFA8;
      margin: 0;
      color: #000;
    }

    .reader-shell {
      width: min(1260px, calc(100% - 40px));
      margin: 25px auto 30px;
    }

    .site-title {
      text-align: center;
      font: 22px "Times New Roman", Times, serif;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    .rule {
      width: 100%;
      border: 0;
      border-top: 1px solid #000;
      margin: 12px 0;
    }

    .paper-title {
      font: 21px "Times New Roman", Times, serif;
      text-align: center;
      margin: 20px 0;
    }

    /* Description column + PDF reading area */

    .reader-layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 34px;
      padding-left: 28px;
      align-items: start;
      margin-top: 25px;
    }

    .description-column {
      padding-top: 5px;
    }

    .description-column h2 {
      font: 18px "Times New Roman", Times, serif;
      font-weight: normal;
      margin: 0 0 20px;
    }

    .description-column h3 {
      font: 15px "Times New Roman", Times, serif;
      font-weight: normal;
      margin: 0 0 8px;
    }

    .description-column p {
      font: 17px Garamond, serif;
      line-height: 1.35;
      text-align: justify;
      margin: 8px 0 20px;
    }

    .description-column a {
      color: #000;
      font: 14px "Times New Roman", Times, serif;
      text-decoration: none;
    }

    .description-column a:hover {
      background: #000;
      color: #dae8e5;
    }

    /* Borderless PDF viewer */

    .paper-column {
      min-width: 0;
      margin-left: 10px;
    }

    .pdf-viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 155px);
      min-height: 650px;
      border: none;
      outline: none;
      box-shadow: none;
      background: transparent;
    }

    .pdf-fallback {
      margin-top: 10px;
      font: 13px "Times New Roman", Times, serif;
    }

    .pdf-fallback a {
      color: #000;
      text-decoration: none;
    }

    .pdf-fallback a:hover {
      text-decoration: underline;
    }

    @media (max-width: 800px) {
      .reader-layout {
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 20px;
        padding-left: 0;
      }

      .paper-column {
        margin-left: 0;
      }
    }

    @media (max-width: 620px) {
      .reader-layout {
        display: block;
      }

      .description-column {
        margin-bottom: 25px;
      }

      .pdf-viewer {
        height: 75vh;
        min-height: 550px;
      }
    }
  </style>
</head>

<body>

  <main class="reader-shell">

    <div class="site-title">
      C R A V E T C H I
    </div>

    <hr class="rule">

    <div class="paper-title">
      Sidetracks: A Rewriting of Logical Investigations
    </div>

    <div class="reader-layout">

      <!-- LEFT-HAND DESCRIPTION COLUMN -->

      <aside class="description-column">

        <h2>1/18</h2>

        <h3>DESCRIPTION</h3>

        <p>
          The first installment of
          <i>Sidetracks: A Rewriting of Logical Investigations.</i>
        </p>

        <br>

        <a href="index.html">← RETURN TO INDEX</a>

      </aside>

      <!-- RIGHT-HAND PDF VIEWER -->

      <section class="paper-column">

        <iframe
          class="pdf-viewer"
          src="sidetracks-1.pdf#toolbar=1&navpanes=0&view=FitH"
          title="Sidetracks — 1/18">
        </iframe>

        <div class="pdf-fallback">
          <a href="sidetracks-1.pdf" target="_blank">
            Open PDF in a separate tab
          </a>
        </div>

      </section>

    </div>

  </main>

</body>
</html>
