<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Installment I of Sidetracks: An Exploration of Logical Investigations by Maximilian Cravetchi.">
  <meta name="author" content="Maximilian Cravetchi">
  <link rel="author" href="/author/">
  <link rel="canonical" href="https://mcravetchi.github.io/sidetracks/i/">
  <title>SIDETRACKS — I — MAXIMILIAN CRAVETCHI</title>
  <style>
    * { box-sizing: border-box; }
    :root { --ink: #C8BFA8; --charcoal: #1B1B1B; }
    body {
      margin: 0;
      background: var(--charcoal);
      color: var(--ink);
      color-scheme: dark;
      font: 16px/1.4 "Times New Roman", Times, serif;
    }
    .page { width: min(1040px, calc(100% - 32px)); margin: 25px auto 35px; }
    .publication { display: grid; grid-template-columns: 200px minmax(0, 1fr); column-gap: 24px; align-items: start; margin-top: 24px; }
    .publication-info, .reading-column { min-width: 0; }
    a { color: inherit; }
    a:hover, a:focus-visible { background: var(--ink); color: var(--charcoal); }
    .site-title { text-align: center; font-size: 22px; letter-spacing: 5px; margin-bottom: 12px; }
    .site-title a { text-decoration: none; padding: 2px 5px; }
    hr { border: 0; border-top: 1px solid var(--ink); margin: 12px 0; }
    .work { text-align: center; padding: 0 0 22px; }
    .work h1 { font-size: 22px; font-weight: normal; letter-spacing: 1px; margin: 0; }
    .subtitle { font: 19px Garamond, Georgia, serif; margin: 8px 0 24px; }
    .installment { font-size: 30px; margin: 0 0 12px; }
    .byline { font: 17px Garamond, Georgia, serif; margin: 0; }
    .byline a { text-underline-offset: 3px; }
    .document-links { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 0; }
    .document-links a, .return-link { padding: 7px 12px; text-decoration: none; font-size: 13px; letter-spacing: .5px; }
    .document-links a { display: block; border: 1px solid var(--ink); text-align: center; }
    .pdf-viewer { display: block; width: 100%; height: 78vh; min-height: 520px; border: 1px solid var(--ink); }
    .navigation { margin: 16px 0 0; }
    .navigation table { width: 100%; table-layout: fixed; border-collapse: collapse; text-align: center; }
    .navigation th, .navigation td { border: 1px solid var(--ink); padding: 0; }
    .navigation th { font-weight: normal; font-size: 13px; letter-spacing: .5px; padding: 9px; }
    .navigation td a, .navigation td span { display: block; padding: 13px 4px; font-size: 19px; text-decoration: none; }
    .navigation .current { box-shadow: inset 0 -3px var(--ink); }
    .back { text-align: center; margin: 14px 0 0; }
    @media (max-width: 760px) {
      .publication { grid-template-columns: minmax(0, 1fr); row-gap: 20px; margin-top: 20px; }
      .publication-info { width: 100%; }
      .document-links { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .document-links a { padding: 7px 4px; }
      .pdf-viewer { height: 70vh; min-height: 400px; }
    }
    @media (max-width: 620px) {
      .site-title { font-size: 18px; letter-spacing: 3px; }
      .pdf-viewer { display: none; }
      .navigation { margin-top: 0; }
    }
    @media (max-width: 360px) {
      .document-links { grid-template-columns: 1fr; }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="page">
    <header class="site-title"><a href="/">C R A V E T C H I</a></header>
    <hr>

    <div class="publication">
      <div class="publication-info">
        <header class="work">
          <h1>SIDETRACKS</h1>
          <p class="subtitle">An Exploration of Logical Investigations</p>
          <p class="installment" aria-label="Installment I">I</p>
          <p class="byline"><a href="/author/">Maximilian Cravetchi</a></p>
        </header>
        <div class="document-links" aria-label="Manuscript links">
          <a href="Cravetchi-Sidetracks-I.pdf" target="_blank" rel="noopener">OPEN PDF</a>
          <a href="Cravetchi-Sidetracks-I.pdf" download>DOWNLOAD PDF</a>
          <a href="/sidetracks/i/manuscript/">READ TEXT</a>
        </div>
      </div>

      <div class="reading-column">
        <section aria-label="Manuscript">
          <object class="pdf-viewer" type="application/pdf" data="Cravetchi-Sidetracks-I.pdf" aria-label="Installment I manuscript PDF">
            <p><a href="Cravetchi-Sidetracks-I.pdf">Open the manuscript PDF.</a></p>
          </object>
        </section>

        <nav class="navigation" aria-label="Sidetracks installments">
          <table>
            <thead><tr><th colspan="4">SIDETRACKS</th></tr></thead>
            <tbody><tr>
              <td><span class="current" aria-current="page" aria-label="Installment I, current">I</span></td>
              <td><span aria-label="Installment II, not published">?</span></td>
              <td><span aria-label="Installment III, not published">?</span></td>
              <td><span aria-label="Installment IV, not published">?</span></td>
            </tr></tbody>
          </table>
          <p class="back"><a class="return-link" href="/#sidetracks">RETURN TO INDEX</a></p>
        </nav>
      </div>
    </div>
  </main>

</body>
</html>
